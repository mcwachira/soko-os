openapi: 3.1.0
info:
  title: Soko-OS API
  version: 1.0.0
  description: |
    Soko-OS Backend API for offline-first POS system with multi-tenancy,
    tax compliance, accounting integration, and synchronization capabilities.
  contact:
    name: Soko-OS Team
    email: support@soko-os.io
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: http://localhost:8080/api/v1
    description: Development server
  - url: https://api.soko-os.io/api/v1
    description: Production server

tags:
  - name: Authentication
    description: Authentication endpoints
  - name: Health
    description: Health check endpoints
  - name: Sales
    description: Sales management
  - name: Products
    description: Product catalog management
  - name: Categories
    description: Category hierarchy management
  - name: Shifts
    description: Cash shift management
  - name: Returns
    description: Returns and refunds management
  - name: Refunds
    description: Refund processing
  - name: Sync
    description: Offline synchronization
  - name: Metrics
    description: Prometheus metrics

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Laravel Sanctum personal access token

  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
        request_id:
          type: string

    HealthResponse:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        system:
          type: string
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, unhealthy]
                driver:
                  type: string
            redis:
              type: object
              properties:
                status:
                  type: string
                  enum: [healthy, unhealthy]
            tax_adapter:
              type: object
              properties:
                status:
                  type: string
                note:
                  type: string
            sync_engine:
              type: object
              properties:
                status:
                  type: string

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          format: password
        device_uuid:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
              format: email
            phone:
              type: string
            role:
              type: string
            permissions:
              type: array
              items:
                type: string
            organization_id:
              type: string
              format: uuid

    Sale:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        terminal_id:
          type: string
          format: uuid
        cashier_user_id:
          type: string
          format: uuid
        shift_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        receipt_number:
          type: string
        invoice_number:
          type: string
        status:
          type: string
          enum: [pending, completed, cancelled, refunded]
        subtotal_minor:
          type: integer
        discount_minor:
          type: integer
        tax_total_minor:
          type: integer
        grand_total_minor:
          type: integer
        paid_total_minor:
          type: integer
        change_due_minor:
          type: integer
        tax_submission_status:
          type: string
        accounting_sync_status:
          type: string
        notes:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SaleItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sale_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        quantity:
          type: number
          format: decimal
        unit_price_minor:
          type: integer
        discount_minor:
          type: integer
        tax_rate_percentage:
          type: number
          format: decimal
        tax_amount_minor:
          type: integer
        subtotal_minor:
          type: integer
        total_minor:
          type: integer

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sale_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
        currency:
          type: string
        payment_method:
          type: string
          enum: [cash, card, mpesa, airtel, bank, credit, points]
        status:
          type: string
          enum: [pending, completed, failed, cancelled, refunded]
        reference:
          type: string
        external_transaction_id:
          type: string

    StoreSaleRequest:
      type: object
      required:
        - branch_id
        - items
        - payments
      properties:
        branch_id:
          type: string
          format: uuid
        terminal_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        shift_id:
          type: string
          format: uuid
        discount_minor:
          type: integer
        notes:
          type: string
        items:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - product_id
              - sku
              - name
              - quantity
              - unit_price_minor
            properties:
              product_id:
                type: string
                format: uuid
              sku:
                type: string
              name:
                type: string
              quantity:
                type: number
                minimum: 0.001
              unit_price_minor:
                type: integer
                minimum: 0
              discount_minor:
                type: integer
                minimum: 0
              tax_rate_percentage:
                type: number
                format: decimal
                minimum: 0
                maximum: 100
        payments:
          type: array
          minItems: 1
          items:
            type: object
            required:
              - amount_minor
              - payment_method
            properties:
              amount_minor:
                type: integer
                minimum: 1
              payment_method:
                type: string
                enum: [cash, card, mpesa, airtel, bank, credit, points]
              reference:
                type: string
              phone_number:
                type: string

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
        sku:
          type: string
        barcode:
          type: string
        name:
          type: string
        description:
          type: string
        tax_category_code:
          type: string
        unit:
          type: string
        cost_price_minor:
          type: integer
        selling_price_minor:
          type: integer
        reorder_level:
          type: integer
        track_inventory:
          type: boolean
        is_active:
          type: boolean
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    StoreProductRequest:
      type: object
      required:
        - sku
        - name
        - cost_price_minor
        - selling_price_minor
      properties:
        category_id:
          type: string
          format: uuid
        sku:
          type: string
        barcode:
          type: string
        name:
          type: string
        description:
          type: string
        tax_category_code:
          type: string
        unit:
          type: string
        cost_price_minor:
          type: integer
          minimum: 0
        selling_price_minor:
          type: integer
          minimum: 0
        reorder_level:
          type: integer
          minimum: 0
        track_inventory:
          type: boolean

    Category:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        parent_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CashShift:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        terminal_id:
          type: string
          format: uuid
        cashier_user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, closed]
        opened_at:
          type: string
          format: date-time
        closed_at:
          type: string
          format: date-time
        opening_float_minor:
          type: integer
        expected_cash_minor:
          type: integer
        actual_cash_minor:
          type: integer
        variance_minor:
          type: integer
        cash_sales_minor:
          type: integer
        cash_in_minor:
          type: integer
        cash_out_minor:
          type: integer
        cash_refunds_minor:
          type: integer

    OpenShiftRequest:
      type: object
      required:
        - terminal_id
        - opening_float_minor
      properties:
        terminal_id:
          type: string
          format: uuid
        opening_float_minor:
          type: integer
          minimum: 0
        notes:
          type: string

    CloseShiftRequest:
      type: object
      required:
        - actual_cash_minor
      properties:
        actual_cash_minor:
          type: integer
        notes:
          type: string

    Return:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        terminal_id:
          type: string
          format: uuid
        sale_id:
          type: string
          format: uuid
        cashier_user_id:
          type: string
          format: uuid
        shift_id:
          type: string
          format: uuid
        return_number:
          type: string
        status:
          type: string
          enum: [pending, approved, rejected, completed, cancelled]
        return_type:
          type: string
          enum: [refund, exchange, store_credit]
        subtotal_minor:
          type: integer
        tax_total_minor:
          type: integer
        grand_total_minor:
          type: integer
        refunded_total_minor:
          type: integer
        reason:
          type: string
        notes:
          type: string
        approved_by_user_id:
          type: string
          format: uuid
        approved_at:
          type: string
          format: date-time

    Refund:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        return_id:
          type: string
          format: uuid
        sale_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
        customer_id:
          type: string
          format: uuid
        refund_number:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed, cancelled]
        refund_method:
          type: string
          enum: [cash, card, mpesa, airtel, bank, store_credit, original]
        amount_minor:
          type: integer
        currency:
          type: string
        reference:
          type: string
        external_transaction_id:
          type: string
        reason:
          type: string

    SyncPushRequest:
      type: object
      required:
        - device_id
        - branch_id
        - operations
      properties:
        device_id:
          type: string
        branch_id:
          type: string
          format: uuid
        operations:
          type: array
          items:
            type: object
            required:
              - operation_id
              - entity_name
              - action
              - local_id
              - idempotency_key
              - data
            properties:
              operation_id:
                type: string
              entity_name:
                type: string
                enum: [sales, customers, inventory_movements, cash_shifts, products, returns, refunds]
              action:
                type: string
                enum: [create, update, delete]
              local_id:
                type: string
              idempotency_key:
                type: string
              data:
                type: object

    SyncPushResponse:
      type: object
      properties:
        cursor:
          type: string
        accepted:
          type: array
        rejected:
          type: array
        conflicts:
          type: array

    PaginatedResponse:
      type: object
      properties:
        current_page:
          type: integer
        data:
          type: array
        first_page_url:
          type: string
        from:
          type: integer
        last_page:
          type: integer
        last_page_url:
          type: string
        links:
          type: array
        next_page_url:
          type: string
        path:
          type: string
        per_page:
          type: integer
        prev_page_url:
          type: string
        to:
          type: integer
        total:
          type: integer

security:
  - bearerAuth: []

paths:
  /health:
    get:
      tags: [Health]
      summary: System health check
      responses:
        '200':
          description: System healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: System degraded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/database:
    get:
      tags: [Health]
      summary: Database health check
      responses:
        '200':
          description: Database healthy
        '503':
          description: Database unhealthy

  /health/redis:
    get:
      tags: [Health]
      summary: Redis health check
      responses:
        '200':
          description: Redis healthy
        '503':
          description: Redis unhealthy

  /auth/login:
    post:
      tags: [Authentication]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/logout:
    post:
      tags: [Authentication]
      summary: User logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logout successful

  /auth/me:
    get:
      tags: [Authentication]
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
        '401':
          description: Unauthorized

  /sales:
    get:
      tags: [Sales]
      summary: List sales
      security:
        - bearerAuth: []
      parameters:
        - name: per_page
          in: query
          schema:
            type: integer
            default: 25
      responses:
        '200':
          description: List of sales
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

    post:
      tags: [Sales]
      summary: Create sale
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreSaleRequest'
      responses:
        '201':
          description: Sale created
        '422':
          description: Validation error
        '403':
          description: Forbidden

  /sales/{id}:
    get:
      tags: [Sales]
      summary: Get sale details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sale details
        '404':
          description: Sale not found

  /sales/{id}/receipt:
    get:
      tags: [Sales]
      summary: Generate receipt
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          schema:
            type: string
            enum: [html, escpos]
            default: html
      responses:
        '200':
          description: Receipt generated
        '404':
          description: Sale not found

  /products:
    get:
      tags: [Products]
      summary: List products
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          schema:
            type: string
        - name: category_id
          in: query
          schema:
            type: string
            format: uuid
        - name: barcode
          in: query
          schema:
            type: string
        - name: per_page
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: List of products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'

    post:
      tags: [Products]
      summary: Create product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProductRequest'
      responses:
        '201':
          description: Product created
        '422':
          description: Validation error

  /products/search:
    get:
      tags: [Products]
      summary: Search products
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          description: Search results

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product details

    put:
      tags: [Products]
      summary: Update product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreProductRequest'
      responses:
        '200':
          description: Product updated

    delete:
      tags: [Products]
      summary: Delete product
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product deleted

  /categories:
    get:
      tags: [Categories]
      summary: List categories
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of categories

    post:
      tags: [Categories]
      summary: Create category
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - slug
              properties:
                name:
                  type: string
                slug:
                  type: string
                parent_id:
                  type: string
                  format: uuid
      responses:
        '201':
          description: Category created

  /categories/{id}:
    get:
      tags: [Categories]
      summary: Get category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category details

    put:
      tags: [Categories]
      summary: Update category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                slug:
                  type: string
                parent_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Category updated

    delete:
      tags: [Categories]
      summary: Delete category
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category deleted

  /shifts/current:
    get:
      tags: [Shifts]
      summary: Get current shift
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current shift

  /shifts/open:
    post:
      tags: [Shifts]
      summary: Open cash shift
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OpenShiftRequest'
      responses:
        '201':
          description: Shift opened
        '409':
          description: User already has open shift

  /shifts/close:
    post:
      tags: [Shifts]
      summary: Close cash shift
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseShiftRequest'
      responses:
        '200':
          description: Shift closed
        '404':
          description: No open shift found

  /returns:
    get:
      tags: [Returns]
      summary: List returns
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of returns

    post:
      tags: [Returns]
      summary: Create return
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sale_id
                - return_type
                - items
              properties:
                sale_id:
                  type: string
                  format: uuid
                shift_id:
                  type: string
                  format: uuid
                terminal_id:
                  type: string
                  format: uuid
                return_type:
                  type: string
                  enum: [refund, exchange, store_credit]
                reason:
                  type: string
                notes:
                  type: string
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required:
                      - sale_item_id
                      - quantity
                    properties:
                      sale_item_id:
                        type: string
                        format: uuid
                      quantity:
                        type: number
                      return_reason:
                        type: string
                      condition:
                        type: string
      responses:
        '201':
          description: Return created

  /returns/{id}:
    get:
      tags: [Returns]
      summary: Get return details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Return details

    put:
      tags: [Returns]
      summary: Update return
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [pending, approved, rejected, completed, cancelled]
                reason:
                  type: string
                notes:
                  type: string
      responses:
        '200':
          description: Return updated

  /refunds:
    get:
      tags: [Refunds]
      summary: List refunds
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of refunds

    post:
      tags: [Refunds]
      summary: Create refund
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - sale_id
                - refund_method
                - amount_minor
              properties:
                return_id:
                  type: string
                  format: uuid
                sale_id:
                  type: string
                  format: uuid
                payment_id:
                  type: string
                  format: uuid
                customer_id:
                  type: string
                  format: uuid
                refund_method:
                  type: string
                  enum: [cash, card, mpesa, airtel, bank, store_credit, original]
                amount_minor:
                  type: integer
                  minimum: 1
                currency:
                  type: string
                reference:
                  type: string
                reason:
                  type: string
      responses:
        '201':
          description: Refund created

  /refunds/{id}:
    get:
      tags: [Refunds]
      summary: Get refund details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Refund details

  /refunds/{id}/complete:
    post:
      tags: [Refunds]
      summary: Complete refund
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Refund completed

  /sync/push:
    post:
      tags: [Sync]
      summary: Push offline operations
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Sync push result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResponse'

  /sync/pull:
    post:
      tags: [Sync]
      summary: Pull server changes
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                since_cursor:
                  type: string
                limit:
                  type: integer
                  default: 500
                entities:
                  type: array
                  items:
                    type: string
                  default: [products, categories, customers, tax_rules, branch_config]
              required:
                - branch_id
      responses:
        '200':
          description: Sync pull result

  /sync/conflicts:
    get:
      tags: [Sync]
      summary: List sync conflicts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of conflicts

  /sync/conflicts/{syncOperationId}/resolve:
    post:
      tags: [Sync]
      summary: Resolve sync conflict
      security:
        - bearerAuth: []
      parameters:
        - name: syncOperationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - resolution
              properties:
                resolution:
                  type: string
                  enum: [server_wins, client_wins, merge]
                merged_data:
                  type: object
      responses:
        '200':
          description: Conflict resolved

  /metrics:
    get:
      tags: [Metrics]
      summary: Get metrics (JSON)
      responses:
        '200':
          description: Metrics data

  /metrics/prometheus:
    get:
      tags: [Metrics]
      summary: Get Prometheus metrics
      responses:
        '200':
          description: Prometheus format metrics
          content:
            text/plain:
              schema:
                type: string
