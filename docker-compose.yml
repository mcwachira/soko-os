name: soko-os

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: soko-nginx
    ports:
      - "${NGINX_HTTP_PORT:-8080}:80"
    volumes:
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./apps/backend/public:/var/www/html/public:ro
    depends_on:
      backend:
        condition: service_healthy
      web:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/v1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - soko-network
    restart: unless-stopped

  web:
    image: node:22-slim
    container_name: soko-web
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "${WEB_PORT:-3001}:3000"
    environment:
      NODE_ENV: development
      NEXT_TELEMETRY_DISABLED: "1"
      WATCHPACK_POLLING: "true"
      CI: "true"
      PNPM_IGNORE_BUILDS_ERRORS: "true"
    command: >
      sh -c "cd apps/web &&
             corepack enable &&
             corepack prepare pnpm@11.23.0 --activate &&
             npx next dev --hostname 0.0.0.0 --port 3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s
    networks:
      - soko-network
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    container_name: soko-backend
    working_dir: /var/www/html
    volumes:
      - ./apps/backend:/var/www/html
    environment:
      APP_NAME: Soko-OS
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY: ${APP_KEY:-base64:c29rb29zLW1hc3Rlci1kZXYta2V5LTIwMjYxMj09}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-soko_os}
      DB_USERNAME: ${DB_USERNAME:-soko}
      DB_PASSWORD: ${DB_PASSWORD:-sokosecret}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
      MAIL_FROM_ADDRESS: hello@soko-os.africa
      MAIL_FROM_NAME: Soko-OS
      FILESYSTEM_DISK: s3
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-sokominio}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-sokominiosecret}
      AWS_DEFAULT_REGION: us-east-1
      AWS_BUCKET: ${AWS_BUCKET:-soko-storage}
      AWS_ENDPOINT: http://minio:9000
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      KRA_MODE: ${KRA_MODE:-sandbox}
      KRA_BASE_URL: ${KRA_BASE_URL:-https://etims-sbx.kra.go.ke}
      KRA_PIN: ${KRA_PIN:-}
      KRA_CLIENT_ID: ${KRA_CLIENT_ID:-}
      KRA_CLIENT_SECRET: ${KRA_CLIENT_SECRET:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(extension_loaded(\"pdo_pgsql\") && extension_loaded(\"redis\") ? 0 : 1);'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - soko-network
    restart: unless-stopped

  queue:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    container_name: soko-queue
    working_dir: /var/www/html
    volumes:
      - ./apps/backend:/var/www/html
    environment:
      APP_NAME: Soko-OS
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY: ${APP_KEY:-base64:c29rb29zLW1hc3Rlci1kZXYta2V5LTIwMjYxMj09}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-soko_os}
      DB_USERNAME: ${DB_USERNAME:-soko}
      DB_PASSWORD: ${DB_PASSWORD:-sokosecret}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
      MAIL_MAILER: smtp
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    command: php artisan queue:work redis --sleep=1 --tries=3 --timeout=90 --max-time=3600
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - soko-network
    restart: unless-stopped

  scheduler:
    build:
      context: .
      dockerfile: infrastructure/docker/php/Dockerfile
    container_name: soko-scheduler
    working_dir: /var/www/html
    volumes:
      - ./apps/backend:/var/www/html
    environment:
      APP_NAME: Soko-OS
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: ${APP_URL:-http://localhost:8080}
      APP_KEY: ${APP_KEY:-base64:c29rb29zLW1hc3Rlci1kZXYta2V5LTIwMjYxMj09}
      LOG_CHANNEL: stderr
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-soko_os}
      DB_USERNAME: ${DB_USERNAME:-soko}
      DB_PASSWORD: ${DB_PASSWORD:-sokosecret}
      REDIS_CLIENT: phpredis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: redis
    command: >
      sh -c "while true; do
        php artisan schedule:run --verbose --no-interaction;
        sleep 60;
      done"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - soko-network
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: soko-postgres
    environment:
      POSTGRES_DB: ${DB_DATABASE:-soko_os}
      POSTGRES_USER: ${DB_USERNAME:-soko}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sokosecret}
    ports:
      - "${POSTGRES_PORT:-5437}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - soko-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: soko-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6382}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - soko-network
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:latest
    container_name: soko-mailpit
    ports:
      - "${MAILPIT_UI_PORT:-8026}:8025"
      - "${MAILPIT_SMTP_PORT:-1026}:1025"
    networks:
      - soko-network
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: soko-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sokominio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sokominiosecret}
    ports:
      - "${MINIO_API_PORT:-9002}:9000"
      - "${MINIO_CONSOLE_PORT:-9003}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - soko-network
    restart: unless-stopped

  minio-init:
    image: quay.io/minio/mc:latest
    container_name: soko-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sokominio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sokominiosecret}
      AWS_BUCKET: ${AWS_BUCKET:-soko-storage}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD} &&
      mc mb --ignore-existing local/$${AWS_BUCKET} &&
      echo Bucket ready
      "
    networks:
      - soko-network
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  soko-network:
    driver: bridge
