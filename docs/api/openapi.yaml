openapi: 3.0.3
info:
  title: Soko-OS API
  description: Backend API for Soko-OS — the offline-first POS platform for African businesses.
  version: 1.0.0
  contact:
    name: Soko-OS Engineering

servers:
  - url: http://localhost:8080/api/v1
    description: Local Docker stack

security:
  - BearerAuth: []

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum token

  schemas:
    Organization:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        tax_number:
          type: string
          nullable: true
        country_code:
          type: string
          example: KE
        currency:
          type: string
          example: KES
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Business:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        business_type:
          type: string
          example: retail
        tax_pin:
          type: string
          nullable: true
        currency:
          type: string
          example: KES
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Product:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        category_id:
          type: string
          format: uuid
          nullable: true
        sku:
          type: string
        barcode:
          type: string
          nullable: true
        name:
          type: string
        description:
          type: string
          nullable: true
        tax_category_code:
          type: string
          nullable: true
        unit:
          type: string
          nullable: true
        cost_price_minor:
          type: integer
        selling_price_minor:
          type: integer
        reorder_level:
          type: integer
          nullable: true
        track_inventory:
          type: boolean
        is_active:
          type: boolean
        version:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Sale:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        terminal_id:
          type: string
          format: uuid
          nullable: true
        cashier_user_id:
          type: string
          format: uuid
        shift_id:
          type: string
          format: uuid
          nullable: true
        customer_id:
          type: string
          format: uuid
          nullable: true
        receipt_number:
          type: string
        status:
          type: string
          example: completed
        subtotal_minor:
          type: integer
        discount_minor:
          type: integer
        tax_total_minor:
          type: integer
        grand_total_minor:
          type: integer
        paid_total_minor:
          type: integer
        change_due_minor:
          type: integer
        tax_submission_status:
          type: string
        accounting_sync_status:
          type: string
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SaleItem:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sale_id:
          type: string
          format: uuid
        product_id:
          type: string
          format: uuid
        sku:
          type: string
        name:
          type: string
        quantity:
          type: number
          format: decimal
        unit_price_minor:
          type: integer
        discount_minor:
          type: integer
        tax_rate_percentage:
          type: number
          format: decimal
        tax_amount_minor:
          type: integer
        subtotal_minor:
          type: integer
        total_minor:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        sale_id:
          type: string
          format: uuid
        amount_minor:
          type: integer
        currency:
          type: string
          example: KES
        payment_method:
          type: string
          enum: [cash, card, mpesa, airtel, bank, credit, points]
        status:
          type: string
          example: completed
        reference:
          type: string
          nullable: true
        external_transaction_id:
          type: string
          nullable: true
        provider_response:
          type: object
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CashShift:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        terminal_id:
          type: string
          format: uuid
          nullable: true
        cashier_user_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [open, closed]
        opened_at:
          type: string
          format: date-time
          nullable: true
        closed_at:
          type: string
          format: date-time
          nullable: true
        opening_float_minor:
          type: integer
        cash_sales_minor:
          type: integer
        cash_in_minor:
          type: integer
        cash_out_minor:
          type: integer
        cash_refunds_minor:
          type: integer
        expected_cash_minor:
          type: integer
        actual_cash_minor:
          type: integer
          nullable: true
        variance_minor:
          type: integer
          nullable: true
        notes:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ReturnModel:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        terminal_id:
          type: string
          format: uuid
          nullable: true
        sale_id:
          type: string
          format: uuid
        cashier_user_id:
          type: string
          format: uuid
        shift_id:
          type: string
          format: uuid
          nullable: true
        return_number:
          type: string
        status:
          type: string
          enum: [pending, approved, completed, rejected, cancelled]
        return_type:
          type: string
          enum: [refund, exchange, store_credit]
        subtotal_minor:
          type: integer
        tax_total_minor:
          type: integer
        grand_total_minor:
          type: integer
        refunded_total_minor:
          type: integer
        reason:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        approved_by_user_id:
          type: string
          format: uuid
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Refund:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        business_id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        return_id:
          type: string
          format: uuid
          nullable: true
        sale_id:
          type: string
          format: uuid
        payment_id:
          type: string
          format: uuid
          nullable: true
        customer_id:
          type: string
          format: uuid
          nullable: true
        refund_number:
          type: string
        status:
          type: string
          enum: [pending, processing, completed, failed, cancelled]
        refund_method:
          type: string
          enum: [cash, card, mpesa, store_credit, credit]
        amount_minor:
          type: integer
        currency:
          type: string
          example: KES
        reference:
          type: string
          nullable: true
        external_transaction_id:
          type: string
          nullable: true
        provider_response:
          type: object
          nullable: true
        reason:
          type: string
          nullable: true
        processed_by_user_id:
          type: string
          format: uuid
          nullable: true
        processed_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Health:
      type: object
      properties:
        status:
          type: string
          enum: [ok, degraded]
        system:
          type: string
        timestamp:
          type: string
          format: date-time
        services:
          type: object
          properties:
            database:
              type: object
              properties:
                status:
                  type: string
                driver:
                  type: string
            redis:
              type: object
              properties:
                status:
                  type: string
            tax_adapter:
              type: object
            sync_engine:
              type: object

    Error:
      type: object
      properties:
        message:
          type: string

  responses:
    Unauthorized:
      description: Unauthenticated
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Unauthenticated

    Forbidden:
      description: Forbidden
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: Branch not found or access denied

    NotFound:
      description: Not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            message: 'The selected branch does not belong to your organization.'

paths:
  /health:
    get:
      tags: [System]
      summary: System health
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /health/database:
    get:
      tags: [System]
      summary: Database health
      security: []
      responses:
        '200':
          description: Database healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /health/redis:
    get:
      tags: [System]
      summary: Redis health
      security: []
      responses:
        '200':
          description: Redis healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'

  /metrics:
    get:
      tags: [System]
      summary: Metrics (JSON)
      security: []
      responses:
        '200':
          description: Metrics payload

  /metrics/prometheus:
    get:
      tags: [System]
      summary: Metrics (Prometheus format)
      security: []
      responses:
        '200':
          description: Prometheus text format
          content:
            text/plain:
              schema:
                type: string

  /auth/login:
    post:
      tags: [Auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Token issued
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                  user:
                    type: object
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Logout
      responses:
        '204':
          description: Token revoked

  /auth/me:
    get:
      tags: [Auth]
      summary: Current user
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object

  /sales:
    get:
      tags: [Sales]
      summary: List sales
      responses:
        '200':
          description: Paginated sales
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Sale'

    post:
      tags: [Sales]
      summary: Create sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [branch_id, items, payments]
              properties:
                branch_id:
                  type: string
                  format: uuid
                terminal_id:
                  type: string
                  format: uuid
                  nullable: true
                customer_id:
                  type: string
                  format: uuid
                  nullable: true
                shift_id:
                  type: string
                  format: uuid
                  nullable: true
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [product_id, sku, name, quantity, unit_price_minor]
                    properties:
                      product_id:
                        type: string
                        format: uuid
                      sku:
                        type: string
                      name:
                        type: string
                      quantity:
                        type: number
                      unit_price_minor:
                        type: integer
                      discount_minor:
                        type: integer
                        default: 0
                      tax_rate_percentage:
                        type: number
                        default: 16
                payments:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [amount_minor, payment_method]
                    properties:
                      amount_minor:
                        type: integer
                      payment_method:
                        type: string
                        enum: [cash, card, mpesa, airtel, bank, credit, points]
                      reference:
                        type: string
                        nullable: true
                discount_minor:
                  type: integer
                  default: 0
                notes:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Sale created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Sale'
        '422':
          $ref: '#/components/responses/ValidationError'

  /sales/{id}:
    get:
      tags: [Sales]
      summary: Get sale
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Sale detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'

  /sales/{id}/receipt:
    get:
      tags: [Sales]
      summary: Generate receipt
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: format
          in: query
          schema:
            type: string
            enum: [html, escpos]
            default: html
      responses:
        '200':
          description: Receipt HTML or ESC/POS text
          content:
            text/html:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string

  /products:
    get:
      tags: [Products]
      summary: List products
      responses:
        '200':
          description: Paginated products
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

    post:
      tags: [Products]
      summary: Create product
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, selling_price_minor]
              properties:
                sku:
                  type: string
                barcode:
                  type: string
                name:
                  type: string
                description:
                  type: string
                tax_category_code:
                  type: string
                unit:
                  type: string
                cost_price_minor:
                  type: integer
                selling_price_minor:
                  type: integer
                reorder_level:
                  type: integer
                track_inventory:
                  type: boolean
                is_active:
                  type: boolean
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'

  /products/search:
    get:
      tags: [Products]
      summary: Search products
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Product'

  /products/{id}:
    get:
      tags: [Products]
      summary: Get product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Product detail
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'

    put:
      tags: [Products]
      summary: Update product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                selling_price_minor:
                  type: integer
                cost_price_minor:
                  type: integer
                is_active:
                  type: boolean
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Product'

    delete:
      tags: [Products]
      summary: Delete product
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Product deleted

  /categories:
    get:
      tags: [Catalog]
      summary: List categories
      responses:
        '200':
          description: Paginated categories
          content:
            application/json:
              schema:
                type: object

    post:
      tags: [Catalog]
      summary: Create category
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                parent_id:
                  type: string
                  format: uuid
                  nullable: true
      responses:
        '201':
          description: Category created
          content:
            application/json:
              schema:
                type: object

  /categories/{id}:
    get:
      tags: [Catalog]
      summary: Get category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category detail

    put:
      tags: [Catalog]
      summary: Update category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Category updated

    delete:
      tags: [Catalog]
      summary: Delete category
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Category deleted

  /customers:
    get:
      tags: [Customers]
      summary: List customers
      responses:
        '200':
          description: Paginated customers
          content:
            application/json:
              schema:
                type: object

    post:
      tags: [Customers]
      summary: Create customer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                  nullable: true
                phone:
                  type: string
                  nullable: true
                tax_pin:
                  type: string
                  nullable: true
                credit_limit_minor:
                  type: integer
      responses:
        '201':
          description: Customer created
          content:
            application/json:
              schema:
                type: object

  /customers/{id}:
    get:
      tags: [Customers]
      summary: Get customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Customer detail

    put:
      tags: [Customers]
      summary: Update customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Customer updated

    delete:
      tags: [Customers]
      summary: Delete customer
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Customer deleted

  /shifts/current:
    get:
      tags: [Cash]
      summary: Current shift
      responses:
        '200':
          description: Current open shift
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CashShift'

  /shifts/open:
    post:
      tags: [Cash]
      summary: Open shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [terminal_id, opening_float_minor]
              properties:
                terminal_id:
                  type: string
                  format: uuid
                opening_float_minor:
                  type: integer
                notes:
                  type: string
                  nullable: true
      responses:
        '201':
          description: Shift opened
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CashShift'
        '409':
          description: Already has open shift

  /shifts/close:
    post:
      tags: [Cash]
      summary: Close shift
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [actual_cash_minor]
              properties:
                actual_cash_minor:
                  type: integer
                notes:
                  type: string
                  nullable: true
      responses:
        '200':
          description: Shift closed
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/CashShift'

  /returns:
    get:
      tags: [Returns]
      summary: List returns
      responses:
        '200':
          description: Paginated returns
          content:
            application/json:
              schema:
                type: object

    post:
      tags: [Returns]
      summary: Create return
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [sale_id, return_type, items]
              properties:
                sale_id:
                  type: string
                  format: uuid
                terminal_id:
                  type: string
                  format: uuid
                  nullable: true
                shift_id:
                  type: string
                  format: uuid
                  nullable: true
                return_type:
                  type: string
                  enum: [refund, exchange, store_credit]
                items:
                  type: array
                  minItems: 1
                  items:
                    type: object
